<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>React CDN App (HTML, CSS, JS)</title>

  <!-- 1. React & React DOM CDNs -->
  <script src="https://unpkg.com" crossorigin></script>
  <script src="https://unpkg.com" crossorigin></script>

  <!-- 2. Babel CDN (Compiles JSX into JavaScript in the browser) -->
  <script src="https://unpkg.com"></script>

  <!-- 3. Embedded Native CSS -->
  <style>
    /* Design Variables for Light & Dark Mode */
    :root {
      --bg-color: #f3f4f6;
      --card-bg: #ffffff;
      --text-color: #1f2937;
      --accent-color: #4f46e5;
      --accent-hover: #4338ca;
      --border-color: #e5e7eb;
    }

    [data-theme="dark"] {
      --bg-color: #111827;
      --card-bg: #1f2937;
      --text-color: #f9fafb;
      --accent-color: #6366f1;
      --accent-hover: #4f46e5;
      --border-color: #374151;
    }

    /* Base Layout Reset */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* Component App Styles */
    .app-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 32px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .theme-btn {
      background: none;
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 12px;
    }

    .counter-display {
      text-align: center;
      font-size: 48px;
      font-weight: 700;
      margin: 24px 0;
    }

    .action-btn {
      width: 100%;
      background-color: var(--accent-color);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.2);
    }

    .action-btn:hover {
      background-color: var(--accent-hover);
    }
  </style>
</head>
<body>

  <!-- 4. HTML Container Element -->
  <div id="root"></div>

  <!-- 5. React & Vanilla JavaScript Logic -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    function CustomApp() {
      const [count, setCount] = useState(0);
      const [isDarkMode, setIsDarkMode] = useState(false);

      // JavaScript Effect: Dynamically updates the HTML data attribute for CSS targeting
      useEffect(() => {
        document.documentElement.setAttribute(
          'data-theme', 
          isDarkMode ? 'dark' : 'light'
        );
      }, [isDarkMode]);

      return (
        <div className="app-card">
          <header className="header">
            <h3>React Engine</h3>
            <button 
              className="theme-btn" 
              onClick={() => setIsDarkMode(!isDarkMode)}
            >
              Mode: {isDarkMode ? '🌙 Dark' : '☀️ Light'}
            </button>
          </header>

          <main>
            <p style={{ opacity: 0.7, fontSize: '14px' }}>Interactive Click Counter</p>
            <div className="counter-display">{count}</div>
            
            <button 
              className="action-btn"
              onClick={() => setCount(count + 1)}
            >
              Increment Value
            </button>
          </main>
        </div>
      );
    }

    // Modern React 18 DOM Mounting API
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<CustomApp />);
  </script>

</body>
</html>

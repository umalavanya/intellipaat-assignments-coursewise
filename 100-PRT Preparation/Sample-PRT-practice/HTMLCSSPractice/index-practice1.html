<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Authentication UI</title>
    
    
    <!-- for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="index-practice1.css">

</head>
<body>

    <!-- ===================================== -->
     <!-- 1. Sign Up page -->
    <!-- ===================================== --> 

    <div class="container">
        <div class="header">
            <h2>Sign Up</h2>
        </div>

        <div class="content-wrapper">

            <div class="form-section">
                <form action="#">
                    <div class="input-group">
                        <i class="fa-solid fa-envelope icon"></i>
                        <input type="email" name="email" id="email" placeholder="Email" required>
                    </div>

                    <div class="input-group">
                        <i class="fa-solid fa-user icon"></i>
                        <input type="text" name="fullname" id="fullname" placeholder="Full Name" required>
                    </div>

                    <div class="input-group">
                        <i class="fa-solid fa-phone icon"></i>
                        <input type="tel" name="phone" id="phone" placeholder="Phone Number" required>
                    </div>

                    <div class="input-group">
                        <i class="fa-solid fa-envelope icon"></i>
                        <input type="email" name="email" id="email" placeholder="Email" required>
                    </div> 
                    
                    <div class="input-group">
                        <i class="fa-solid fa-lock icon"></i>
                        <input type="password" name="password" id="password" placeholder="********" required>
                        <i class="fa-regular fa-eye-slash toggle-password"></i>
                    </div> 
                    <button type="submit" class="btn-primary">Sign Up</button>
                    <p class="bottom-link">
                        Already having account? <a href="#">Sign In Here</a>
                    </p>
                </form>
            </div>  
            
            <div class="illustration-section">
                <img src="https://img.freepik.com/free-vector/sign-up-concept-illustration_114360-7965.jpg?w=740" alt="Sign Up Illustration">
            </div>
        </div>
    </div>

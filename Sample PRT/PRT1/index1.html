<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Page</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="index1.css">
</head>
<body>

    <div class="container">
        <!-- Header Section -->
        <div class="header">
            <h2>Sign Up</h2>
        </div>

        <!-- Main Content -->
        <div class="content-wrapper">
            
            <!-- Left Side: Form -->
            <div class="form-section">
                <form action="#">
                    
                    <div class="input-group">
                        <i class="fa-solid fa-user icon"></i>
                        <input type="text" placeholder="Full name" required>
                    </div>

                    <div class="input-group">
                        <i class="fa-solid fa-phone icon"></i>
                        <input type="tel" placeholder="Phone number" required>
                    </div>

                    <div class="input-group">
                        <i class="fa-solid fa-envelope icon"></i>
                        <input type="email" placeholder="Email" required>
                    </div>

                    <div class="input-group">
                        <i class="fa-solid fa-lock icon"></i>
                        <input type="password" placeholder="Create password" required>
                        <i class="fa-regular fa-eye-slash toggle-password"></i>
                    </div>

                    <button type="submit" class="btn-signup">Sign Up</button>

                    <p class="login-link">
                        Already having account? <a href="#">Sign In Here</a>
                    </p>
                </form>
            </div>

            <!-- Right Side: Illustration -->
            <div class="illustration-section">
                <!-- Using a placeholder image that resembles the illustration -->
                <img src="https://img.freepik.com/free-vector/sign-up-concept-illustration_114360-7965.jpg?w=740&t=st=1698765432~exp=1698766032~hmac=example" alt="Sign Up Illustration">
            </div>

        </div>
    </div>

</body>
</html>
